<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header class="navbar">
    <button class="btn-toggle-sidebar" id="btnToggleSidebar">☰</button>
    <div class="navbar-brand"><span>Phone-</span>Tracker</div>
    <div class="navbar-status"><span class="live-dot"></span>EN VIVO</div>
    <div class="navbar-time" id="reloj">00:00:00</div>
  </header>

  <div class="app-container">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Dispositivos</h2>
        <input type="text" id="buscador" placeholder="Buscar dispositivo..." class="input-buscar">
      </div>
      <ul class="device-list" id="listaDispositivos"></ul>
      <div class="sidebar-footer">
        <div class="stat-box">
          <span class="stat-num" id="totalDispositivos">0</span>
          <span class="stat-lbl">Total</span>
        </div>
        <div class="stat-box">
          <span class="stat-num verde" id="dispositivosOnline">0</span>
          <span class="stat-lbl">Activos</span>
        </div>
        <div class="stat-box">
          <span class="stat-num rojo" id="dispositivosOffline">0</span>
          <span class="stat-lbl">Offline</span>
        </div>
      </div>
    </aside>

    <main class="map-container">
      <div id="mapa"></div>

      <div class="info-panel">
        <h3 id="info-nombre">Seleccioná un dispositivo</h3>
        <p id="info-rol"></p>
        <div class="info-row"><span>Latitud</span><strong id="info-lat">--</strong></div>
        <div class="info-row"><span>Longitud</span><strong id="info-lng">--</strong></div>
        <div class="info-row"><span>Velocidad</span><strong id="info-vel">--</strong></div>
        <div class="info-row"><span>Batería</span><strong id="info-bat">--</strong></div>
        <div class="info-row"><span>Estado</span><strong id="info-estado">--</strong></div>
      </div>

      <div class="historial-panel">
        <h4>📍 Historial</h4>
        <div id="historialLista"></div>
      </div>

      <button class="btn-agregar" id="btnAgregar">+ Agregar dispositivo</button>

      <div class="modal" id="modal" style="display:none">
        <div class="modal-box">
          <h3>📱 Nuevo Trabajador</h3>
          <input type="text" id="form-nombre"   placeholder="Nombre completo" class="form-input">
          <input type="text" id="form-rol"      placeholder="Rol (ej: Chofer, Técnico)" class="form-input">
          <input type="tel"  id="form-telefono" placeholder="Teléfono con código país (ej: 5493814123456)" class="form-input">
          <select id="form-estado" class="form-input">
            <option value="offline">Offline</option>
            <option value="online">Online</option>
          </select>
          <div class="modal-btns">
            <button id="btnGuardar"  class="btn-guardar">✅ Guardar y enviar</button>
            <button id="btnCancelar" class="btn-cancelar">✖ Cancelar</button>
          </div>
        </div>
      </div>
    </main>

  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/Device.js"></script>
  <script src="js/MapRenderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
