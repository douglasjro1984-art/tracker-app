<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Ubicación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #070b14;
      color: #c8d8f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #0d1526;
      border: 1px solid #1a2a45;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .emoji { font-size: 3rem; margin-bottom: 12px; }

    h1 {
      font-size: 1.1rem;
      color: white;
      margin-bottom: 6px;
    }

    .subtitulo {
      font-size: 0.72rem;
      color: #4a6080;
      margin-bottom: 24px;
    }

    .input {
      width: 100%;
      background: #070b14;
      border: 1px solid #1a2a45;
      border-radius: 8px;
      padding: 12px;
      color: #c8d8f0;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }
    .input:focus { border-color: #00e5ff; }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }

    .btn-iniciar {
      background: #00e5ff;
      color: #000;
    }
    .btn-iniciar:hover { background: #00b8cc; }

    .btn-detener {
      background: transparent;
      color: #ff4d6d;
      border: 1px solid #ff4d6d;
      display: none;
    }

    .estado {
      margin-top: 16px;
      font-size: 0.72rem;
      color: #4a6080;
      min-height: 40px;
    }

    .estado.activo { color: #7cff6b; }
    .estado.error  { color: #ff4d6d; }

    .pulso {
      display: inline-block;
      width: 10px; height: 10px;
      background: #7cff6b;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulsar 1.2s infinite;
    }

    @keyframes pulsar {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.3; transform: scale(0.6); }
    }

    .coords {
      margin-top: 12px;
      font-size: 0.65rem;
      color: #4a6080;
    }
    .coords span { color: #00e5ff; }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">📍</div>
    <h1>Tracker de Empleado</h1>
    <p class="subtitulo">Tu ubicación se enviará al mapa en tiempo real</p>

    <input
      type="text"
      id="inputNombre"
      class="input"
      placeholder="Tu nombre"
      maxlength="30"
    >

    <button class="btn btn-iniciar" id="btnIniciar">
      📡 Iniciar rastreo
    </button>

    <button class="btn btn-detener" id="btnDetener">
      ⏹ Detener rastreo
    </button>

    <div class="estado" id="estado">
      Ingresá tu nombre y presioná iniciar
    </div>

    <div class="coords" id="coords"></div>
  </div>

  <!-- Socket.io se carga automáticamente desde el servidor -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ════════════════════════════════════════
    //  TRACKER.JS — Lógica del empleado
    // ════════════════════════════════════════

    const socket    = io();         // conectamos al servidor
    let intervalGPS = null;         // guardará el intervalo de envío
    let rastreando  = false;

    const btnIniciar = document.getElementById('btnIniciar');
    const btnDetener = document.getElementById('btnDetener');
    const estado     = document.getElementById('estado');
    const coords     = document.getElementById('coords');
    const inputNombre = document.getElementById('inputNombre');

    // ── Iniciar rastreo ──────────────────────
    btnIniciar.addEventListener('click', () => {
      const nombre = inputNombre.value.trim();

      if (!nombre) {
        estado.className = 'estado error';
        estado.textContent = '⚠️ Ingresá tu nombre primero';
        return;
      }

      if (!navigator.geolocation) {
        estado.className = 'estado error';
        estado.textContent = '❌ Tu dispositivo no tiene GPS';
        return;
      }

      rastreando = true;
      btnIniciar.style.display = 'none';
      btnDetener.style.display = 'block';
      inputNombre.disabled = true;

      estado.className = 'estado activo';
      estado.innerHTML = '<span class="pulso"></span>Obteniendo ubicación...';

      // Enviamos la ubicación cada 5 segundos
      const enviarUbicacion = () => {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            // Enviamos al servidor via Socket.io
            socket.emit('enviar-ubicacion', {
              nombre: nombre,
              lat:    lat,
              lng:    lng,
            });

            estado.className = 'estado activo';
            estado.innerHTML = `<span class="pulso"></span>Enviando ubicación`;
            coords.innerHTML = `
              <span>LAT</span> ${lat.toFixed(5)} &nbsp;
              <span>LNG</span> ${lng.toFixed(5)}
            `;
          },
          (error) => {
            estado.className = 'estado error';
            estado.textContent = '❌ No se pudo obtener GPS. Verificá los permisos.';
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // Enviamos inmediatamente y luego cada 5 segundos
      enviarUbicacion();
      intervalGPS = setInterval(enviarUbicacion, 5000);
    });

    // ── Detener rastreo ──────────────────────
    btnDetener.addEventListener('click', () => {
      clearInterval(intervalGPS);
      rastreando = false;

      btnIniciar.style.display = 'block';
      btnDetener.style.display = 'none';
      inputNombre.disabled = false;

      estado.className = 'estado';
      estado.textContent = 'Rastreo detenido';
      coords.textContent = '';
    });

    // ── Confirmar conexión al servidor ───────
    socket.on('connect', () => {
      console.log('Conectado al servidor');
    });
  </script>

</body>
</html>
